name: Publish Sonar metrics

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish-metrics:
    name: Publish Sonar metric data
    if: >-
      ${{ github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - name: Check for Sonar metric artifact
        id: sonar-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          echo "found=false" >> "$GITHUB_OUTPUT"
          artifacts="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts")"
          if jq -e '.artifacts[]? | select(.name == "sonar-metric-badges" and .expired == false)' \
            <<<"$artifacts" >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download Sonar metric artifact
        if: ${{ steps.sonar-artifact.outputs.found == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: sonar-metric-badges
          path: ${{ runner.temp }}/sonar-metric-badges
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish metric JSON files
        if: ${{ always() }}
        env:
          SONAR_ARTIFACT_FOUND: ${{ steps.sonar-artifact.outputs.found }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail

          if [[ "$SONAR_ARTIFACT_FOUND" != "true" ]]; then
            echo "Sonar metrics were unavailable; keeping the previously published values." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          metrics_dir="$RUNNER_TEMP/sonar-metric-badges"
          coverage_file="$metrics_dir/coverage.json"
          loc_file="$metrics_dir/lines-of-code.json"
          jq -e '
            .schemaVersion == 1 and .label == "coverage" and
            (.message | test("^[0-9]+(\\.[0-9]+)?%$")) and .color == "yellowgreen"
          ' "$coverage_file" >/dev/null
          jq -e '
            .schemaVersion == 1 and .label == "Lines of code" and
            (.message | test("^[0-9]+$")) and .color == "blue"
          ' "$loc_file" >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          coverage_ref="$(git ls-remote --heads origin refs/heads/coverage)"
          if [[ -n "$coverage_ref" ]]; then
            git fetch --no-tags origin refs/heads/coverage
            git switch --force-create coverage FETCH_HEAD
          else
            git switch --orphan coverage
            git rm -rf --ignore-unmatch .
          fi

          git rm -f --ignore-unmatch build.json polaris.json spark-4.1.2.json

          is_current_or_newer() {
            local file="$1"
            local previous_number previous_attempt
            if [[ ! -s "$file" ]]; then
              return 0
            fi
            previous_number="$(jq -r '.sourceRunNumber // 0' "$file")"
            previous_attempt="$(jq -r '.sourceRunAttempt // 0' "$file")"
            if (( SOURCE_RUN_NUMBER > previous_number )); then
              return 0
            fi
            if (( SOURCE_RUN_NUMBER == previous_number && SOURCE_RUN_ATTEMPT >= previous_attempt )); then
              return 0
            fi
            return 1
          }

          publish_metric() {
            local source_file="$1"
            local destination_file="$2"
            if is_current_or_newer "$destination_file"; then
              jq \
                --argjson runNumber "$SOURCE_RUN_NUMBER" \
                --argjson runAttempt "$SOURCE_RUN_ATTEMPT" \
                '. + {sourceRunNumber: $runNumber, sourceRunAttempt: $runAttempt}' \
                "$source_file" > "$destination_file"
            else
              echo "Ignoring older metric data from a previous Build run." >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          publish_metric "$coverage_file" coverage.json
          publish_metric "$loc_file" lines-of-code.json
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "Sonar metric badge data is already up to date."
            exit 0
          fi

          git commit -m "Update generated Sonar metric badges"
          git push origin coverage
