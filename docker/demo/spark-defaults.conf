# Keep the local demo's catalog metadata, warehouse, and checkpoints shared
# between its pipeline and query applications and Spark executors.
spark.executor.cores 1
spark.executor.memory 512m
spark.cores.max 2
spark.sql.catalogImplementation hive
spark.sql.defaultCatalog spark_catalog
spark.sql.shuffle.partitions 1
spark.sql.warehouse.dir file:///tmp/spark-control-plane-demo-checkpoints/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL jdbc:derby:;databaseName=/tmp/spark-control-plane-demo-checkpoints/metastore_db;create=true
