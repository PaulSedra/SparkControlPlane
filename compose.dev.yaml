# Local demo submits one Spark application per pipeline run to Standalone.
name: spark-control-plane-demo

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: spark_control_plane
      POSTGRES_USER: spark_control_plane
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  spark-master:
    build:
      context: ./docker/integration/spark
      args:
        SPARK_BASE_IMAGE: apache/spark:4.2.0-python3
        JAVA_RUNTIME_IMAGE: eclipse-temurin:21-jre-jammy
    image: spark-control-plane:spark-demo-4.2.0
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      HOME: /tmp
      SPARK_LOCAL_IP: spark-master
      SPARK_LOCAL_DIRS: /tmp/spark-local
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  spark-worker:
    image: spark-control-plane:spark-demo-4.2.0
    user: "0:0"
    depends_on:
      spark-master:
        condition: service_healthy
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker
      - --webui-port
      - "8081"
    environment:
      HOME: /tmp
      SPARK_LOCAL_IP: spark-worker
      SPARK_LOCAL_DIRS: /tmp/spark-local
      SPARK_WORKER_CORES: "2"
    volumes:
      - demo-spark-data:/tmp/spark-control-plane-demo-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-worker/8081'"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  control-plane:
    build:
      context: .
      args:
        APP_VERSION: 0.2.0
        NODE_IMAGE: node:24.19.0-bookworm-slim
        PYTHON_IMAGE: python:3.10.12-slim-bookworm
    image: spark-control-plane:demo
    depends_on:
      postgres:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    environment:
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: 8080
      CATALOG_BACKEND: spark
      AISTOR_WEBHOOK_TOKEN: local-development-only
      PIPELINES_DIR: /app/pipelines
      PIPELINE_RUN_STATE_DIRECTORY: /app/run-state
      PYTHON_EXECUTABLE: /usr/local/bin/python
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: spark_control_plane
      POSTGRES_USER: spark_control_plane
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_SSLMODE: disable
      POSTGRES_SCHEMA: public
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: control-plane
      SPARK_EXECUTOR_PYTHON: ${SPARK_EXECUTOR_PYTHON:-python3}
      SPARK_CLI_BINARY: ${SPARK_CLI_BINARY:-spark-pipelines}
      SPARK_CLI_PROPERTIES_FILE: /app/spark-defaults.demo.conf
      SPARK_HISTORY_URL: ${SPARK_HISTORY_URL:-}
    ports:
      - "127.0.0.1::8080"
    volumes:
      - type: bind
        source: ./examples/pipelines
        target: /app/pipelines
        read_only: true
      - type: bind
        source: ./docker/demo/spark-defaults.conf
        target: /app/spark-defaults.demo.conf
        read_only: true
      - demo-spark-data:/tmp/spark-control-plane-demo-checkpoints
      - demo-run-state:/app/run-state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "docker/control-plane-healthcheck.mjs"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  demo-postgres-data:
  demo-run-state:
  demo-spark-data:
