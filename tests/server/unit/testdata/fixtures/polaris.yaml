configCases:
  - name: reuses control-plane credentials with a separate database
    environment:
      POSTGRES_DATABASE: spark_control_plane
      POSTGRES_HOST: postgres.internal
      POSTGRES_PASSWORD: opaque-test-value
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      POSTGRES_USER: spark
      POLARIS_POSTGRES_DATABASE: polaris
    expected:
      ca: null
      cert: null
      database: polaris
      host: postgres.internal
      key: null
      password: opaque-test-value
      port: 5432
      schema: polaris_schema
      tlsMode: disable
      user: spark
  - name: is absent when no PostgreSQL connection is configured
    environment: {}
    expected: null
  - name: defaults to the named polaris database when credentials are shared
    environment:
      POSTGRES_HOST: postgres.internal
      POSTGRES_PASSWORD: opaque-test-value
      POSTGRES_USER: spark
    expected:
      ca: null
      cert: null
      database: polaris
      host: postgres.internal
      key: null
      password: opaque-test-value
      port: 5432
      schema: polaris_schema
      tlsMode: require
      user: spark
  - name: ignores legacy database and TLS aliases
    environment:
      POSTGRES_HOST: postgres.internal
      POSTGRES_PASSWORD: opaque-test-value
      POSTGRES_USER: spark
      POLARIS_POSTGRES_DB: legacy-database
      POLARIS_POSTGRES_TLS_MODE: disable
    expected:
      ca: null
      cert: null
      database: polaris
      host: postgres.internal
      key: null
      password: opaque-test-value
      port: 5432
      schema: polaris_schema
      tlsMode: require
      user: spark

